<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>治験終了まで</title>
<style>
  :root { --ink:#1d3557; --accent:#2a9d8f; --c:#1d3557; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; background:#fff; overflow:hidden; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; touch-action:manipulation;
    font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif; color:var(--ink); }
  body.hurry  { --c:#e4572e; }
  body.danger { --c:#d62828; }
  body.final  { --c:#b00020; }
  body.over   { --c:#b00020; }

  /* ---------- setup ---------- */
  #setup { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4vh; background:#fff; z-index:5; }
  #setup h1 { font-size:4vw; font-weight:500; letter-spacing:.3em; color:var(--ink); }
  #setup .sub { font-size:1.6vw; color:#6b7a90; letter-spacing:.2em; }
  .presets { display:flex; gap:1.5vw; }
  .presets button, #go, #fs {
    font:inherit; font-size:2vw; padding:1.2vw 2.6vw; border:2px solid #cfd8e3; border-radius:1vw; background:#fff; color:var(--ink); cursor:pointer; transition:.15s;
  }
  .presets button:hover, #fs:hover { border-color:var(--accent); color:var(--accent); }
  .presets button.sel { border-color:var(--accent); background:var(--accent); color:#fff; }
  .custom { display:flex; align-items:baseline; gap:1vw; font-size:2vw; }
  #min { width:7vw; font:inherit; font-size:3vw; text-align:center; border:none; border-bottom:3px solid var(--accent); outline:none; color:var(--ink); background:transparent; }
  #go { background:var(--ink); color:#fff; border-color:var(--ink); font-size:2.2vw; padding:1.2vw 6vw; }
  #go:hover { background:var(--accent); border-color:var(--accent); }
  #fs { font-size:1.2vw; padding:.6vw 1.6vw; position:fixed; right:2vw; bottom:2vw; color:#6b7a90; }

  /* ---------- main ---------- */
  #main { position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; cursor:none; }
  body.running-view #setup { display:none; }
  body.running-view #main { display:flex; }
  #head { font-size:4.2vw; font-weight:500; letter-spacing:.5em; padding-left:.5em; color:var(--ink); }
  #time { font-size:30vw; line-height:1.05; font-weight:600; color:var(--c); font-variant-numeric:tabular-nums; letter-spacing:.02em; transition:color .5s; }
  #status { font-size:3vw; letter-spacing:.25em; height:5vw; color:var(--c); transition:color .5s; }
  #bar { position:fixed; left:8vw; right:8vw; bottom:21vh; height:.9vh; background:#e8edf3; border-radius:1vh; overflow:hidden; }
  #fill { height:100%; width:100%; background:var(--accent); border-radius:1vh; transition:background .5s; }
  body.hurry #fill, body.danger #fill, body.final #fill, body.over #fill { background:var(--c); }

  /* 急がす演出 */
  #vig { position:fixed; inset:0; pointer-events:none; opacity:0; box-shadow:inset 0 0 18vw 2vw rgba(214,40,40,.55); }
  body.hurry #vig  { animation:pulse 2s ease-in-out infinite; }
  body.danger #vig { animation:pulse 1s ease-in-out infinite; }
  body.final #vig  { animation:pulse .5s ease-in-out infinite; }
  body.over #vig   { opacity:.8; animation:none; }
  @keyframes pulse { 0%,100%{opacity:0} 50%{opacity:1} }
  body.final #time { animation:shake .12s infinite; }
  @keyframes shake { 0%{transform:translate(0,0)} 25%{transform:translate(.3vw,.15vw)} 50%{transform:translate(-.25vw,-.2vw)} 75%{transform:translate(.15vw,-.15vw)} 100%{transform:translate(0,0)} }
  body.hurry #status, body.danger #status, body.final #status { animation:txt 1s ease-in-out infinite; }
  @keyframes txt { 0%,100%{opacity:1} 50%{opacity:.35} }

  #panel { position:fixed; left:0; right:0; bottom:4vh; display:flex; justify-content:center; gap:1.2vw; opacity:0; pointer-events:none; transition:opacity .3s; }
  #panel.show { opacity:1; pointer-events:auto; }
  #panel button { font:inherit; font-size:2vw; padding:1.4vw 1.8vw; min-width:8vw; border:2px solid #cfd8e3; border-radius:1vw; background:rgba(255,255,255,.96); color:var(--ink); touch-action:manipulation; }
  #panel button:active { background:var(--accent); color:#fff; border-color:var(--accent); }
  #panel #pp { background:var(--ink); color:#fff; border-color:var(--ink); min-width:16vw; }
  #msg { position:fixed; right:2vw; top:2vh; font-size:1.6vw; color:#6b7a90; opacity:0; transition:opacity .3s; }
</style>
</head>
<body>

<!-- 開始時間の選択 -->
<div id="setup">
  <h1>治験終了まで</h1>
  <div class="sub">開始時間を選んでください</div>
  <div class="presets" id="presets">
    <button data-m="40">40分</button>
    <button data-m="30">30分</button>
    <button data-m="20">20分</button>
    <button data-m="10">10分</button>
  </div>
  <div class="custom">自由入力 <input id="min" type="number" min="1" max="99" value="40"> 分</div>
  <button id="go">決定</button>
  <button id="fs">全画面</button>
</div>

<!-- タイマー画面 -->
<div id="main">
  <div id="head">治験終了まで</div>
  <div id="time">40:00</div>
  <div id="status"></div>
  <div id="bar"><div id="fill"></div></div>
  <div id="panel">
    <button data-a="-60">−1分</button><button data-a="-10">−10秒</button>
    <button id="pp">▶ 開始</button>
    <button data-a="10">+10秒</button><button data-a="60">+1分</button>
    <button id="back">選択へ</button><button id="fs2">全画面</button>
  </div>
</div>
<div id="vig"></div>
<div id="msg"></div>

<script>
const TICK = true;                 // 残り10分以内の秒針音（不要なら false）
const ALERTS = [30, 20, 10, 5];    // アラートを鳴らす残り分

let mode = 'setup';                // 'setup' | 'main'
let total = 40*60*1000, remaining = total, running = false, started = false, endAt = 0, stage = 'normal', lastSec = -1;
const armed = {};

const $ = id => document.getElementById(id);
const elTime = $('time'), elStatus = $('status'), elFill = $('fill'), elMsg = $('msg');

/* ---------- Audio ---------- */
let ac = null;
function audio(){ if(!ac) ac = new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); return ac; }
function buzz(delay, dur, freq, vol=.35){
  const a = audio(), t = a.currentTime + delay;
  const lp = a.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 2200;
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t+.01);
  g.gain.setValueAtTime(vol, t+dur-.04);
  g.gain.linearRampToValueAtTime(0.0001, t+dur);
  [freq, freq*1.012].forEach(f=>{
    const o = a.createOscillator(); o.type='square'; o.frequency.value = f;
    o.connect(lp); o.start(t); o.stop(t+dur+.02);
  });
  lp.connect(g); g.connect(a.destination);
}
function tick(strong){
  const a = audio(), t = a.currentTime;
  const o = a.createOscillator(), g = a.createGain();
  o.type = 'sine'; o.frequency.value = strong ? 1600 : 1100;
  g.gain.setValueAtTime(strong ? .18 : .08, t);
  g.gain.exponentialRampToValueAtTime(.001, t+.05);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+.06);
}
const PATTERN = {
  30:  { f:200, v:.30, p:[[0,.7]] },
  20:  { f:220, v:.32, p:[[0,.7]] },
  10:  { f:260, v:.35, p:[[0,.5],[.7,.5]] },
  5:   { f:300, v:.38, p:[[0,.4],[.55,.4],[1.1,.4]] },
  end: { f:160, v:.45, p:[[0,3.2]] },
};
const SND_MAP = {30:'normal', 20:'normal', 10:'siren', 5:'siren'};   // end は内蔵ブザー
const bufs = {}; let sndLoading = false;
function loadSounds(){
  if(sndLoading) return; sndLoading = true;
  const a = audio();
  Object.entries(SND_B64).forEach(([k,b64])=>{
    const bin = atob(b64), u = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
    try{ const p = a.decodeAudioData(u.buffer, buf=>{ bufs[k]=buf; }, ()=>{}); if(p && p.catch) p.catch(()=>{}); }catch(_){}
  });
}
function play(key){
  const k = SND_MAP[key];
  if(k && bufs[k]){ const a = audio(), src = a.createBufferSource(); src.buffer = bufs[k]; src.connect(a.destination); src.start(); }
  else synth(key);
}
function synth(key){ const s = PATTERN[key]; s.p.forEach(([d,l])=>buzz(d,l,s.f,s.v)); }

/* ---------- Display ---------- */
function fmt(ms){
  const s = Math.max(0, Math.ceil(ms/1000));
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}
function stageOf(ms){
  if(ms<=0) return 'over';
  if(ms<=60000) return 'final';
  if(ms<=300000) return 'danger';
  if(ms<=600000) return 'hurry';
  return 'normal';
}
function setStatus(){
  if(stage==='over'){ elStatus.textContent = '治験終了'; return; }
  if(!running){ elStatus.textContent = started ? '一時停止中' : '画面をタップして ▶ 開始'; return; }
  elStatus.textContent = {normal:'', hurry:'残り10分 — お急ぎください', danger:'残り5分', final:'まもなく終了'}[stage];
}
function applyStage(){
  document.body.classList.remove('hurry','danger','final','over');
  if(stage!=='normal') document.body.classList.add(stage);
  setStatus();
}
function rearm(){ ALERTS.forEach(m => armed[m] = remaining > m*60000); }
function flashMsg(t){ elMsg.textContent=t; elMsg.style.opacity=1; clearTimeout(flashMsg.t); flashMsg.t=setTimeout(()=>elMsg.style.opacity=0,1200); }

function update(){
  if(mode==='main'){
    if(running){
      remaining = endAt - performance.now();
      if(remaining<=0){ remaining = 0; running = false; play('end'); refreshPP(); showPanel(); }
    }
    elTime.textContent = fmt(remaining);
    elFill.style.width = (Math.min(1, remaining/Math.max(total,remaining,1))*100) + '%';

    const s = stageOf(remaining);
    if(s!==stage){ stage = s; applyStage(); }

    // アラート 30/20/10/5
    ALERTS.forEach(m=>{
      if(remaining > m*60000) armed[m] = true;
      else if(armed[m]){ armed[m] = false; if(running) play(String(m)); }
    });

    // 毎秒の演出
    const sec = Math.ceil(remaining/1000);
    if(running && sec!==lastSec && remaining>0 && remaining<=600000){
      if(TICK) tick(remaining<=60000);
      elTime.animate([{transform:'scale(1)'},{transform:'scale(1.03)'},{transform:'scale(1)'}], {duration:350});
    }
    lastSec = sec;
  }
  requestAnimationFrame(update);
}

/* ---------- Controls ---------- */
function enterMain(min){
  loadSounds();
  total = min*60*1000; remaining = total; running = false; started = false; stage = 'normal'; lastSec = -1;
  rearm(); applyStage();
  mode = 'main';
  document.body.classList.add('running-view');
  refreshPP(); showPanel();
}
function backToSetup(){
  running = false; mode = 'setup';
  document.body.classList.remove('running-view','hurry','danger','final','over');
}
function toggle(){
  loadSounds();
  if(remaining<=0) return;
  if(running){ running = false; }
  else { running = true; started = true; endAt = performance.now() + remaining; rearm(); lastSec = Math.ceil(remaining/1000); }
  setStatus(); refreshPP(); showPanel();
  try{ if(running && navigator.wakeLock) navigator.wakeLock.request('screen').catch(()=>{}); }catch(_){}
}
function adjust(ms){
  remaining = Math.max(0, Math.min(remaining+ms, 99*60*1000));
  if(running) endAt = performance.now() + remaining;
  total = Math.max(total, remaining);
  rearm();
  showPanel();
  flashMsg((ms>0?'+':'−') + Math.abs(ms/1000) + '秒');
}

// setup UI
let sel = 40;
function select(m){
  sel = m; $('min').value = m;
  document.querySelectorAll('#presets button').forEach(b=>b.classList.toggle('sel', +b.dataset.m===m));
}
document.querySelectorAll('#presets button').forEach(b=>b.addEventListener('click', ()=>select(+b.dataset.m)));
$('min').addEventListener('input', ()=>{ sel = Math.max(1, Math.min(99, parseInt($('min').value)||1)); select2(); });
function select2(){ document.querySelectorAll('#presets button').forEach(b=>b.classList.toggle('sel', +b.dataset.m===sel)); }
$('go').addEventListener('click', ()=>enterMain(sel));
$('fs').addEventListener('click', toggleFS);
function toggleFS(){ const d=document, e=d.documentElement;
  if(d.fullscreenElement||d.webkitFullscreenElement){ (d.exitFullscreen||d.webkitExitFullscreen).call(d); }
  else { const f=e.requestFullscreen||e.webkitRequestFullscreen; if(f) f.call(e); else flashMsg('共有→ホーム画面に追加 で全画面にできます'); } }
const panel = $('panel'); let ph;
function showPanel(){ panel.classList.add('show'); clearTimeout(ph); if(running) ph = setTimeout(()=>panel.classList.remove('show'), 5000); }
function refreshPP(){ $('pp').textContent = running ? '⏸ 一時停止' : (started ? '▶ 再開' : '▶ 開始'); }
panel.addEventListener('click', e=>{
  e.stopPropagation();
  const b = e.target.closest('button'); if(!b) return;
  if(b.id==='pp') toggle();
  else if(b.id==='back') backToSetup();
  else if(b.id==='fs2') toggleFS();
  else if(b.dataset.a) adjust(+b.dataset.a*1000);
});
$('main').addEventListener('click', ()=>{ if(panel.classList.contains('show')) panel.classList.remove('show'); else showPanel(); });
select(40);

document.addEventListener('keydown', e=>{
  if(mode==='setup'){
    if(e.code==='Enter'){ e.preventDefault(); enterMain(sel); }
    return;
  }
  switch(e.code){
    case 'Space':      e.preventDefault(); if(!e.repeat) toggle(); break;
    case 'ArrowRight': e.preventDefault(); adjust(60000); break;
    case 'ArrowLeft':  e.preventDefault(); adjust(-60000); break;
    case 'ArrowUp':    e.preventDefault(); adjust(10000); break;
    case 'ArrowDown':  e.preventDefault(); adjust(-10000); break;
    case 'KeyR': backToSetup(); break;
    case 'KeyH': panel.classList.toggle('show'); break;
    case 'KeyF': toggleFS(); break;
  }
});
document.addEventListener('keydown', e=>{ if(mode==='setup' && e.code==='KeyF' && document.activeElement.id!=='min'){ toggleFS(); } });

requestAnimationFrame(update);
</script>
</body>
</html>
